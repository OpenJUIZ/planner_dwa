[workspace]
resolver = "2"
members = ["crates/dwa_core", "crates/planner_dwa"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/OpenJUIZ/planner_dwa"
rust-version = "1.88"

[workspace.dependencies]
# juiz_sdk の版は app/juizapp.yaml の juiz と揃える(release.yml が確かめる)
juiz_sdk = "=0.2.4"
juiz_std_types = "=0.2.4"
dwa_core = { path = "crates/dwa_core" }
