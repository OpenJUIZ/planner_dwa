name: Docker

# docker/Dockerfile のイメージを amd64 と arm64 でビルドし、docker/compose.yml で mobile_sim のイメージと
# つないで結合テストを走らせる。main では ghcr.io/openjuiz/planner_dwa:edge、タグ v* では :<版> と :latest として公開する。

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/openjuiz/planner_dwa
  # 結合テストでつなぐ mobile_sim。この ref からイメージをビルドして compose に渡す
  MOBILE_SIM_REF: main
  MOBILE_SIM_IMAGE: mobile_sim:ci

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux/amd64, os: ubuntu-24.04, arch: amd64 }
          - { platform: linux/arm64, os: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          # compose.yml の image と同じ名前にして、compose がこのイメージを使うようにする
          tags: ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Build mobile_sim
        run: |
          git clone --depth 1 --branch "$MOBILE_SIM_REF" https://github.com/OpenJUIZ/mobile_sim.git ../mobile_sim
          docker build -f ../mobile_sim/docker/Dockerfile -t "$MOBILE_SIM_IMAGE" ../mobile_sim
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test with compose
        run: |
          docker compose -f docker/compose.yml up -d --no-build
          python3 -u scripts/integration_test.py --sim-url http://localhost:8000 --dwa-url http://localhost:8004
          # ブラウザ画面が出ること
          curl -sf -o /dev/null localhost:8004/
          curl -sf -o /dev/null localhost:8004/planner_dwa.js
      - name: Logs
        if: always()
        run: docker compose -f docker/compose.yml logs --no-color | tail -200
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Push by digest
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
      - name: Save the digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  publish:
    # 2 つのアーキのイメージを 1 つのタグにまとめる
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Create the manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)
