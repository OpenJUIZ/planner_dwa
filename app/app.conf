# planner_dwa の起動設定
#   先に mobile_sim を IPC 名 mobile_sim で動かしておく(juiz run mobile_sim、または juiz -f app.conf -d --ipc mobile_sim)
#   開発中: scripts/dev_plugin.sh でプラグインを app/plugins/<target>/ に置いてから
#           cd app && juiz -f app.conf -d
#   グローバルパス(トピック path、planner_dijkstra が出す)と自己位置(トピック amcl_pose、localization_amcl が出す)を受け、
#   mobile_sim の odom・scan・lidar_mount を使って DWA で速度指令を求め、トピック cmd_vel に出す(10 Hz)。
#   画面は http://localhost:8004/
"name": "planner_dwa"
"option":
  "http_broker":
    "start": true
    "port": 8004
    # ブラウザ画面(conf のディレクトリからの相対)
    "static_filepaths":
      "/": "web"
# ほかの System とトピックをやり取りするため、こちらも IPC ブローカーを持つ
"brokers":
  - "type_name": "ipc"
    "name": "planner_dwa"
# mobile_sim につなぐ。package を書くと、juiz run は juizapp.yaml の depends の mobile_sim としてこれを使い、版を確かめる
# (別の機械の mobile_sim を使うときは juiz run --depend mobile_sim=http://<host>:8000)
"subsystems":
  - "package": "mobile_sim"
    "type_name": "ipc"
    "name": "mobile_sim"
"plugins":
  "components":
    "planner_dwa":
      "language": "rust"
      "path": "plugins/{target}"
"containers":
  - "type_name": "dwa_planner"
    "name": "dwa0"
    # 自己位置: amcl(amcl_pose と odom から)か odom(odom をそのまま map の姿勢とみなす。AMCL 無しで試すとき)
    "pose_source": "amcl"
    "frame_id": "map"
    # odom・scan がこれより古ければ止まる [s]
    "sensor_timeout": 1.0
    # パスを追っているのにこの時間 [s] で 5 cm も進まなければ、状態(dwa_status)を stuck にする
    "stuck_time": 5.0
    # juiz#449 の回避: 兄弟の System(localization_amcl・planner_dijkstra)のトピックはこの形では届かないので、
    # それらの HTTP ブローカーから amcl_get_pose と planner_get_path を読む。トピックが届いていればトピックを使う。
    # navigation_manager の下で動かすときや、#449 が直ったら null にする
    "bridge":
      "amcl": "http://localhost:8002"
      "planner": "http://localhost:8003"
      "rate": 5
    # DWA のパラメータ。名前と意味は ROS dwa_local_planner と同じ。書かないものは ROS の既定値。
    # mobile_sim の既定のロボット(半径 0.2 m、最大 1.0 m/s・1.5 rad/s、加速度 1.0 m/s²・3.0 rad/s²)に合わせた
    "params":
      "max_vel_x": 0.5
      "min_vel_x": 0.0
      "max_vel_trans": 0.5
      "min_vel_trans": 0.1
      "max_vel_theta": 1.0
      # ROS の既定 0.4 だと、止まった状態から加速度の制限(3.0 × 0.1 s = 0.3 rad/s)でその場で回れない
      "min_vel_theta": 0.2
      "acc_lim_x": 1.0
      "acc_lim_theta": 3.0
      "sim_time": 1.7
      "vx_samples": 6
      "vth_samples": 20
      # 下の main_ec の rate と同じにする
      "controller_frequency": 10.0
      "path_distance_bias": 32.0
      "goal_distance_bias": 24.0
      "occdist_scale": 0.01
      "forward_point_distance": 0.325
      "xy_goal_tolerance": 0.1
      "yaw_goal_tolerance": 0.1
      "robot_radius": 0.2
      "inflation_radius": 0.55
      "local_window": 3.0
    "processes":
      - "type_name": "dwa_set_path"
        "name": "set_path0"
        "use_memo": false
        "subscribes":
          "path": "path"
      - "type_name": "dwa_set_pose"
        "name": "set_pose0"
        "use_memo": false
        "subscribes":
          "pose": "amcl_pose"
      - "type_name": "dwa_set_odometry"
        "name": "set_odometry0"
        "use_memo": false
        "subscribes":
          "odom": "odom"
      - "type_name": "dwa_set_scan"
        "name": "set_scan0"
        "use_memo": false
        "subscribes":
          "scan": "scan"
      - "type_name": "dwa_set_laser_pose"
        "name": "set_laser_pose0"
        "use_memo": false
        "subscribes":
          "pose": "lidar_mount"
      # 下の main_ec が 10 Hz で呼び、速度指令をトピック cmd_vel(mobile_sim の robot0 が受ける)に出す
      - "type_name": "dwa_compute"
        "name": "compute0"
        "use_memo": false
        "publishes":
          - "cmd_vel"
      # 短い状態をトピック dwa_status に出す(navigation_manager などが立ち往生を見る)
      - "type_name": "dwa_get_status"
        "name": "get_status0"
        "use_memo": false
        "publishes":
          - "dwa_status"
      - "type_name": "dwa_set_goal"
        "name": "set_goal0"
        "use_memo": false
      - "type_name": "dwa_cancel"
        "name": "cancel0"
        "use_memo": false
      - "type_name": "dwa_set_params"
        "name": "set_params0"
        "use_memo": false
      - "type_name": "dwa_get_state"
        "name": "get_state0"
        "use_memo": false
"ecs":
  # main_loop_ec は 1 つのシステムに 1 つだけ
  - "type_name": "main_loop_ec"
    "name": "main_ec"
    "rate": 10
    "bind":
      - "type_name": "dwa_compute"
        "name": "compute0"
        "container_name": "dwa0"
      - "type_name": "dwa_get_status"
        "name": "get_status0"
        "container_name": "dwa0"
    "auto_start": true
