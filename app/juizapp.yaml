# .juizapp のマニフェスト(juiz docs/spec/app-package.md §4)。languages・targets・rust・files は juiz pack が書き足す
format: 1
name: planner_dwa
version: 0.1.1
kind: app
description: "DWA local planner: follows a global path with the robot pose and outputs velocity commands, modeled on ROS dwa_local_planner (works with mobile_sim)"
license: MIT OR Apache-2.0
homepage: https://github.com/OpenJUIZ/planner_dwa
# C ABI の Rust プラグインなので、その ABI を読める juiz(Cargo.toml の juiz_sdk と同じ版以降)なら rustc は問わない
juiz: ">=0.2.4"
entry: app.conf
# odom・scan・lidar_mount を受け、cmd_vel を出す。juiz run が ipc://mobile_sim を subsystem に足して版を確かめる
depends:
  mobile_sim: ">=0.3.1, <0.4"
